name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: cfsecrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets present — deploying."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping deploy (add them in Repo Settings → Secrets and variables → Actions)."
          fi

      - uses: actions/checkout@v4
        if: steps.cfsecrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfsecrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.cfsecrets.outputs.ok == 'true'
        run: npm ci

      - name: Build (slim, no sidecars)
        if: steps.cfsecrets.outputs.ok == 'true'
        env:
          DEPLOY_TARGET: cf
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.cfsecrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # repo root on purpose: functions/ ship alongside dist/ assets
        run: npx -y wrangler@latest pages deploy . --project-name interlinear-greek --commit-dirty=true
